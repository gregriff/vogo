version: '2'
run:
  tests: false
linters:
  enable:
    - bodyclose
    - exhaustive
    - goconst
    - godot
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
  exclusions:
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      - linters:
          - revive
        text: 'var-naming:|exported:|package-comments:|unexported-return:'
    generated: lax
    presets:
      - common-false-positives
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
# formatters:
  # enable:
    # - gofumpt
    # - goimports
  # exclusions:
    # generated: lax
