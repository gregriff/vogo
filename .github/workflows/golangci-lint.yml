# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: golangci-lint
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  # Optional: allow read access to pull requests. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  lint-cli:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./cli
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-base

      - name: install-dependencies
        run: brew install opus opusfile

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
  lint-server:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/go-base

      - name: vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
