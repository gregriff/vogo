# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: go-base
description: "sets up a go action using setup-go, and the project's go version"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        # go-version-file: <subrepo>/go.mod
        # cache: true
        # cache-dependency-path: <subrepo>/go.sum
        go-version: '1.27rc2'
