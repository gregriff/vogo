# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: go-base
description: "sets up a go action using checkout, setup-go, and the project's go version"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
